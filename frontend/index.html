<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f4" />
    <title>Photomap | フィールド写真マップ</title>
    <script>
      const redirect = sessionStorage.getItem('photomap-redirect');
      if (redirect) {
        sessionStorage.removeItem('photomap-redirect');
        history.replaceState(null, '', redirect);
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
